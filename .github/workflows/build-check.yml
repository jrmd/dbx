name: Fast CI

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'vendor/**'
      - 'scripts/**'
      - 'packaging/**'
      - '.github/actions/prepare-rust-build/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'vendor/**'
      - 'scripts/**'
      - 'packaging/**'
      - '.github/actions/prepare-rust-build/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-rust-build
        with:
          cache-profile: ci
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Check Rust warnings
        run: cargo clippy --locked --profile ci --workspace --all-targets -- -D warnings
      - name: Compile workspace tests
        run: cargo test --locked --profile ci --workspace --no-run
      - name: Run workspace tests
        run: cargo test --locked --profile ci --workspace
      - name: Test macOS release packaging
        run: python3 scripts/test-macos-release.py
      - name: Test release notes
        run: python3 scripts/test-release-notes.py
