name: Live database integration

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/dbx-core/**'
      - 'docker-compose.test.yml'
      - 'scripts/test-integration.sh'
      - '.github/workflows/integration.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/dbx-core/**'
      - 'docker-compose.test.yml'
      - 'scripts/test-integration.sh'
      - '.github/workflows/integration.yml'
  schedule:
    # Nightly, to catch new database image releases.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      CXXFLAGS: '-g0'
      DBX_TEST_CARGO_PROFILE: release
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-rust-build
      - name: Install disposable SSH fixture tools
        run: sudo apt-get install -y openssh-server openssl
      - name: Run disposable database suite
        run: bash scripts/test-integration.sh
      - name: Verify sockets, SSH and strict TLS identity
        run: python3 scripts/test-transports.py
