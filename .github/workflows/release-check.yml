name: Full release check

on:
  schedule:
    - cron: '43 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-rust-build
      - name: Run release workspace tests
        run: cargo test --locked --release --workspace
      - name: Check release Rust warnings
        run: cargo clippy --locked --release --workspace --all-targets -- -D warnings
      - name: Build release application
        run: cargo build --locked --release --package dbx-ui
