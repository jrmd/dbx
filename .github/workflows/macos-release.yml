name: macOS release candidate

on:
  workflow_dispatch:
    inputs:
      signed:
        description: Sign with Developer ID and notarize (requires Apple secrets)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-rust-build
      - name: Run workspace tests
        run: cargo test --locked --release --workspace
      - name: Build, sign, and notarize
        if: inputs.signed
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/release-macos.sh signed
      - name: Build unsigned candidate
        if: ${{ !inputs.signed }}
        run: bash scripts/release-macos.sh unsigned
      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: DBX-macos-${{ runner.arch }}-${{ inputs.signed && 'notarized' || 'unsigned' }}
          path: |
            target/macos/DBX-*.zip
            target/macos/DBX-*.zip.sha256
          if-no-files-found: error
          retention-days: 14
