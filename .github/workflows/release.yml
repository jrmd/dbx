name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Require a version tag matching the workspace
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          python3 - <<'PYTHON'
          import os, tomllib
          version = tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version']
          assert os.environ['RELEASE_REF_TYPE'] == 'tag', 'Run the release workflow on a version tag.'
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Tag must match the workspace version.'
          assert '-' not in version, 'This workflow publishes stable releases only.'
          PYTHON

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-rust-build
      - name: Validate
        run: |
          cargo fmt --all -- --check
          cargo test --locked --release --workspace
          cargo clippy --locked --release --workspace --all-targets -- -D warnings
          python3 scripts/test-macos-release.py
      - name: Linux package
        if: runner.os == 'Linux'
        run: bash scripts/build-linux-app.sh appimage
      - name: Signed Mac package
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/release-macos.sh signed
      - name: Verify signed Mac updater installation
        if: runner.os == 'macOS'
        run: |
          export DBX_MACOS_UPDATE_ARCHIVE="$(pwd)/$(echo target/macos/DBX-*-macos-arm64.zip)"
          cargo test --locked --release -p dbx-ui signed_macos_archive_installs_and_preserves_app_on_rejection -- --ignored --nocapture
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            target/linux/DBX-*.tar.gz
            target/linux/DBX-*.tar.gz.sha256
            target/linux/DBX-*.AppImage
            target/linux/DBX-*.AppImage.sha256
            target/macos/DBX-*.zip
            target/macos/DBX-*.zip.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Artifacts keep their linux/ and macos/ folders; publish a flat list.
          find release -mindepth 2 -type f -exec mv -t release {} +
          find release -mindepth 1 -type d -empty -delete
          (cd release && sha256sum -c ./*.sha256)
          # Keep partially uploaded assets out of /releases/latest.
          gh release create "$RELEASE_TAG" release/* --verify-tag --generate-notes --draft
          gh release edit "$RELEASE_TAG" --draft=false --latest
