name: Prepare Rust build
description: Install platform tools and restore release dependency artifacts
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - name: Install Rust
      shell: bash
      run: |
        rustup toolchain install stable --profile minimal --component rustfmt --component clippy
        rustup default stable
    - name: Linux native dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake pkg-config clang libclang-dev libssl-dev libcurl4-openssl-dev libfontconfig1-dev libfreetype6-dev libx11-xcb-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-randr0-dev libxcb-render0-dev libxcb-sync-dev libxcb-xkb-dev libxcb-composite0-dev libxcb-damage0-dev libxcb-present-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libasound2-dev libudev-dev
    - name: Mac native tools
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install cmake
        xcodebuild -runFirstLaunch
        if ! xcrun --find metal; then
          xcodebuild -downloadComponent MetalToolchain
        fi
    - name: Restore Rust dependencies
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      with:
        shared-key: release-${{ runner.os }}-${{ runner.arch }}
        # rust-cache prunes workspace binaries and non-Cargo output (including
        # bundles and notarization output) before saving dependency artifacts.
        workspaces: '. -> target'
        cache-on-failure: true
