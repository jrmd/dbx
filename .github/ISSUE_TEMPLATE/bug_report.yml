name: Bug report
description: Report a reproducible problem in DBX
body:
  - type: markdown
    attributes:
      value: Remove credentials, personal data and customer data before submitting.
  - type: input
    id: version
    attributes:
      label: DBX version
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and architecture
      placeholder: macOS Apple Silicon, or Linux distribution with Wayland/X11
    validations:
      required: true
  - type: input
    id: database
    attributes:
      label: Database engine and version
      description: Do not paste a connection string containing credentials.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include a minimal fictional schema or query if relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and error message
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or redacted logs
