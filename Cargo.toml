[workspace]
members = [
  "crates/dbx-core",
  "crates/dbx-editor",
  "crates/dbx-storage",
  "crates/dbx-ui",
  "crates/dbx-ui-components",
]
resolver = "2"
exclude = ["vendor/gpui-component", "vendor/accesskit_atspi_common", "vendor/accesskit_unix"]

[workspace.package]
version = "0.16.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1.0"
argon2 = "0.5"
arrayref = "=0.3.6" # 0.3.10 currently publishes an invalid proc-macro1 dependency.
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
chacha20poly1305 = { version = "0.11", features = ["getrandom"] }
dirs = "5.0"
flate2 = "1.1"
futures-util = "0.3"
keyring = "4.1"
percent-encoding = "2.3"
redis = { version = "0.32", features = ["aio", "tokio-comp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
secrecy = "0.10"
sqlparser = { version = "0.63", features = ["visitor"] }
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio-rustls",
  "sqlite",
  "postgres",
  "mysql",
  "chrono",
  "bigdecimal",
  "json",
  "uuid",
] }
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "sync", "time", "process", "net", "io-util"] }
unicode-segmentation = "1.12"
url = "2.5"
uuid = { version = "1.18", features = ["serde", "v4"] }
zeroize = "1.9"
gpui = { git = "https://github.com/zed-industries/zed" }
getrandom = "0.4"
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui-base = { git = "https://github.com/longbridge/gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }

# Keep routine CI compilation fast while retaining the full workspace checks.
[profile.ci]
inherits = "dev"
opt-level = 0
debug = 0
incremental = false
lto = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Faster local release-like builds for checking performance-sensitive changes;
# the shipping `release` profile above is unchanged.
[profile.release-local]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 16
incremental = true
strip = "none"

[patch."https://github.com/longbridge/gpui-component"]
gpui-component = { path = "vendor/gpui-component" }

[patch.crates-io]
accesskit_atspi_common = { path = "vendor/accesskit_atspi_common" }
accesskit_unix = { path = "vendor/accesskit_unix" }
