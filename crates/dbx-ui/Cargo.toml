[package]
name = "dbx-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "dbx"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
pbkdf2 = "0.12"
anyhow.workspace = true
argon2.workspace = true
arrayref.workspace = true
chacha20poly1305.workspace = true
chrono.workspace = true
dbx-core = { path = "../dbx-core" }
dirs.workspace = true
gpui.workspace = true
getrandom.workspace = true
keyring.workspace = true
percent-encoding.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
rust_xlsxwriter = "0.100"
secrecy.workspace = true
thiserror.workspace = true
tokio.workspace = true
unicode-segmentation.workspace = true
url.workspace = true
uuid.workspace = true
zeroize.workspace = true
gpui_platform.workspace = true
gpui-component.workspace = true
gpui-base.workspace = true
gpui-component-assets.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
semver = "1.0"
sha2 = "0.10"
tar = "0.4"
flate2.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
zip = { version = "6", default-features = false, features = ["deflate"] }
gpui = { workspace = true, features = ["test-support"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "=5.19.0", features = ["blocking-api"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSWorkspace", "NSAccessibility"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_UI_WindowsAndMessaging"] }
