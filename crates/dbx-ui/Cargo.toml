[package]
name = "dbx-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "dbx"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
dbx-core = { path = "../dbx-core" }
dbx-editor = { path = "../dbx-editor" }
dbx-storage = { path = "../dbx-storage" }
dbx-ui-components = { path = "../dbx-ui-components" }
dirs.workspace = true
gpui.workspace = true
percent-encoding.workspace = true
serde.workspace = true
serde_json.workspace = true
rust_xlsxwriter = { version = "0.100", features = ["constant_memory"] }
secrecy.workspace = true
thiserror.workspace = true
tokio.workspace = true
url.workspace = true
uuid.workspace = true
zeroize.workspace = true
gpui_platform.workspace = true
gpui-component.workspace = true
gpui-base.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
semver = "1.0"
sha2 = "0.10"
tar = "0.4"
flate2.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSWorkspace", "NSAccessibility"] }
raw-window-handle = "0.6"

[dev-dependencies]
dbx-storage = { path = "../dbx-storage", features = ["test-support"] }
dbx-ui-components = { path = "../dbx-ui-components", features = ["test-support"] }
zip = { version = "6", default-features = false, features = ["deflate"] }
gpui = { workspace = true, features = ["test-support"] }
