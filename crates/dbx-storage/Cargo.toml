[package]
name = "dbx-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aes-gcm = "0.10"
argon2.workspace = true
# Not used directly: holds the workspace-wide pin on arrayref for argon2.
arrayref.workspace = true
chacha20poly1305.workspace = true
dbx-core = { path = "../dbx-core" }
dirs.workspace = true
getrandom.workspace = true
keyring.workspace = true
pbkdf2 = "0.12"
percent-encoding.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
sha2 = "0.10"
tempfile.workspace = true
thiserror.workspace = true
url.workspace = true
uuid.workspace = true
zeroize.workspace = true

# Touch ID: a biometry-gated Keychain item (security-framework) and the
# LocalAuthentication capability probe (objc2). Both are already in the
# workspace's dependency graph through the GPUI stack and keyring.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["NSError", "NSString"] }
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "LAContext", "LAError"] }
security-framework = { version = "3.7", features = ["OSX_10_15"] }

[features]
# Exposes constructors that point stores at temporary directories, for
# dependants' own test suites.
test-support = []

[dev-dependencies]
tokio.workspace = true
