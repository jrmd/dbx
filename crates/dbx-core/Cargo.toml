[package]
name = "dbx-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
flate2.workspace = true
futures-util.workspace = true
redis.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
url.workspace = true
tempfile.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
base64 = "0.22"
percent-encoding.workspace = true
gcp_auth = { version = "0.12.7", default-features = false, features = ["ring"] }
mongodb = "3.3"
duckdb = { version = "1.4", features = ["bundled"] }
rdkafka = { version = "0.39", features = ["cmake-build", "ssl-vendored"] }
chrono.workspace = true
tiberius = { version = "0.12", default-features = false, features = ["tds73", "rustls", "chrono"] }
tokio-util = { version = "0.7", features = ["compat"] }

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
