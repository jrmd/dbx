name: dbx-integration-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dbx_test
      POSTGRES_USER: dbx_test
      POSTGRES_PASSWORD: dbx_test_password
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbx_test -d dbx_test"]
      interval: 2s
      timeout: 5s
      retries: 30

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: dbx_test
      MYSQL_USER: dbx_test
      MYSQL_PASSWORD: dbx_test_password
      MYSQL_ROOT_PASSWORD: dbx_test_root_password
    ports:
      - "127.0.0.1:53306:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test:
        ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u dbx_test -pdbx_test_password --silent"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
