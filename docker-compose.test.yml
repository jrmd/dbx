name: dbx-integration-test

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    environment:
      CLICKHOUSE_DB: dbx_test
      CLICKHOUSE_USER: dbx_test
      CLICKHOUSE_PASSWORD: dbx_test_password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:${DBX_TEST_CLICKHOUSE_PORT:-58123}:8123"
    tmpfs:
      - /var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user dbx_test --password dbx_test_password --query 'SELECT 1'"]
      interval: 2s
      timeout: 5s
      retries: 30
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dbx_test
      POSTGRES_USER: dbx_test
      POSTGRES_PASSWORD: dbx_test_password
    ports:
      - "127.0.0.1:${DBX_TEST_POSTGRES_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbx_test -d dbx_test"]
      interval: 2s
      timeout: 5s
      retries: 30

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: dbx_test
      MYSQL_USER: dbx_test
      MYSQL_PASSWORD: dbx_test_password
      MYSQL_ROOT_PASSWORD: dbx_test_root_password
    ports:
      - "127.0.0.1:${DBX_TEST_MYSQL_PORT:-53306}:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test:
        ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u dbx_test -pdbx_test_password --silent"]
      interval: 2s
      timeout: 5s
      retries: 30

  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: dbx_test
      MARIADB_USER: dbx_test
      MARIADB_PASSWORD: dbx_test_password
      MARIADB_ROOT_PASSWORD: dbx_test_root_password
    ports:
      - "127.0.0.1:${DBX_TEST_MARIADB_PORT:-53307}:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${DBX_TEST_REDIS_PORT:-56379}:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  mongo:
    image: mongo:8
    ports:
      - "127.0.0.1:${DBX_TEST_MONGO_PORT:-57017}:27017"
    tmpfs:
      - /data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 5s
      retries: 30

  cockroach:
    image: cockroachdb/cockroach:v25.1.0
    command: start-single-node --insecure --store=type=mem,size=1GiB
    ports:
      - "127.0.0.1:${DBX_TEST_COCKROACH_PORT:-56257}:26257"
    healthcheck:
      test: ["CMD", "/cockroach/cockroach", "sql", "--insecure", "-e", "SELECT 1"]
      interval: 2s
      timeout: 5s
      retries: 30

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:${DBX_TEST_ELASTICSEARCH_PORT:-59200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow"]
      interval: 3s
      timeout: 5s
      retries: 40

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT is advertised for the host; INTERNAL serves the health check.
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:${DBX_TEST_KAFKA_PORT:-59092},INTERNAL://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "127.0.0.1:${DBX_TEST_KAFKA_PORT:-59092}:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --create --if-not-exists --topic dbx-qa --partitions 1 --replication-factor 1"]
      interval: 3s
      timeout: 15s
      retries: 30

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Dbx_test_Passw0rd"
      MSSQL_PID: Developer
    ports:
      - "127.0.0.1:${DBX_TEST_SQLSERVER_PORT:-51433}:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Dbx_test_Passw0rd -Q 'SELECT 1' -b -o /dev/null"]
      interval: 3s
      timeout: 10s
      retries: 40
